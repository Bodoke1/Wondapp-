<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WONDAPP — IL RADAR DI TUTTI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;800&display=swap');
        :root { --n: #00ff88; --g: #ffd700; --d: #050507; --s: #0f0f1a; --w: #ffffff; }

        * { box-sizing: border-box; margin: 0; padding: 0; border: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--d); color: var(--w); font-family: 'Exo 2', sans-serif; overflow-x: hidden; touch-action: manipulation; }

        /* HEADER */
        .header { padding: 15px; border-bottom: 2px solid var(--n); background: var(--s); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 999; }
        .logo { font-family: 'Orbitron'; color: var(--n); font-size: 20px; letter-spacing: 2px; }
        .badge { font-size: 9px; color: var(--n); border: 1px solid var(--n); padding: 3px 8px; border-radius: 5px; font-weight: 800; text-transform: uppercase; }

        /* MENU ICONE (INCLUSI ARTIGIANI) */
        .quick-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; background: #000; }
        .icon-btn { background: var(--s); padding: 15px 5px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #222; transition: 0.1s; }
        .icon-btn:active { transform: scale(0.92); border-color: var(--n); }
        .icon-btn span { display: block; font-size: 26px; margin-bottom: 5px; }
        .icon-btn p { font-size: 9px; font-weight: 800; color: #ccc; text-transform: uppercase; }

        /* RICERCA */
        .search-area { padding: 15px 20px; background: var(--s); }
        #q { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #333; background: #000; color: #fff; font-size: 16px; }

        /* CARDS E MAPPE */
        .results { padding: 15px; padding-bottom: 120px; }
        .card { background: var(--s); border-radius: 20px; padding: 20px; margin-bottom: 20px; border-left: 6px solid #444; position: relative; overflow: hidden; }
        .card.GOLD { border-left-color: var(--g); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

        /* MAPPA STATICA (Anteprima) */
        .mini-map { width: 100%; height: 160px; border-radius: 12px; margin-top: 15px; background: #111; border: 1px solid #333; overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: 0; filter: invert(90%) hue-rotate(180deg) brightness(0.8); pointer-events: none; } /* pointer-events: none impedisce di muovere la mappa per errore */

        .price-tag { font-size: 28px; font-weight: 800; color: var(--n); text-align: right; margin: 10px 0; }
        .btn { width: 100%; padding: 18px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-go { background: var(--n); color: #000; }
        .btn-radar { background: transparent; border: 2px solid var(--n); color: var(--n); margin-top: 20px; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">WONDAPP</div>
    <div class="badge">ECONOMIA REALE</div>
</div>

<div class="quick-menu">
    <div class="icon-btn" onclick="f('Benzinaio')"><span>⛽</span><p>Benzina</p></div>
    <div class="icon-btn" onclick="f('Artigiano')"><span>🛠️</span><p>Artigiani</p></div>
    <div class="icon-btn" onclick="f('Pizzeria')"><span>🍕</span><p>Pizza</p></div>
    <div class="icon-btn" onclick="f('Farmacia')"><span>💊</span><p>Salute</p></div>
    <div class="icon-btn" onclick="f('Alimentari')"><span>🥖</span><p>Botteghe</p></div>
    <div class="icon-btn" onclick="f('Bar')"><span>☕</span><p>Bar</p></div>
</div>

<div class="search-area">
    <input type="text" id="q" placeholder="Cerca negozi o artigiani..." onkeyup="e()" autocomplete="off">
</div>

<div id="d" class="results"></div>

<script>
const DATA = [
    { n:"MARIO IL FABBRO", c:"Artigiano", l:"Via Roma 10, SGM", p:"PRONTO", f:"GOLD", t:["fabbro","ferro","riparazione"] },
    { n:"PANIFICIO STORICO", c:"Alimentari", l:"Piazza Centrale", p:"1.20", f:"GOLD", t:["pane","focaccia","bottega"] },
    { n:"ENI STATION SGM", c:"Benzinaio", l:"Viale Lombardia", p:"1.759", f:"GOLD", t:["benzina"] }
];

function f(v) { document.getElementById('q').value = v; e(); }

function e() {
    const q = document.getElementById('q').value.toLowerCase().trim();
    const b = document.getElementById('d');
    if (!q) { b.innerHTML = ""; return; }

    const m = DATA.filter(i => (i.n+i.c+(i.t?i.t.join(''):'')).toLowerCase().includes(q));
    let h = "";

    if (m.length > 0) {
        h = m.map(i => `
            <div class="card ${i.f === 'GOLD' ? 'GOLD' : ''}">
                <div style="font-size:10px; color:#888;">${i.c}</div>
                <div style="font-size:19px; font-weight:800;">${i.n}</div>
                <div class="price-tag">${i.p}${i.p.includes('.') ? '€' : ''}</div>
                
                <div class="mini-map">
                    <iframe src="https://maps.google.com/maps?q=${encodeURIComponent(i.n + ' ' + i.l)}&t=&z=14&ie=UTF8&iwloc=&output=embed"></iframe>
                </div>

                <button class="btn btn-go" onclick="n('${i.n}, ${i.l}')">NAVIGA ORA</button>
            </div>
        `).join('');
    }

    h += `<button class="btn btn-radar" onclick="n('${q}')">🔍 ESPANDI RADAR: ${q.toUpperCase()}</button>`;
    b.innerHTML = h;
}

function n(dest) {
    // Solo cliccando qui si apre la mappa esterna per navigare
    window.open("https://www.google.com/maps/search/" + encodeURIComponent(dest), '_blank');
}
</script>
</body>
</html>
