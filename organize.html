<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WONDAPP PROTOTIPO</title>
    <style>
        /* STILE INTEGRATO - NIENTE CARICAMENTI ESTERNI */
        body { background: #050507; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .header { padding: 20px; border-bottom: 3px solid #00ff88; background: #0f0f1a; }
        .logo { color: #00ff88; font-size: 24px; font-weight: bold; letter-spacing: 3px; }
        .search-area { padding: 20px; }
        #q { 
            width: 90%; padding: 15px; border-radius: 30px; 
            border: 2px solid #00ff88; background: #000; color: #fff; 
            font-size: 18px; text-align: center;
        }
        .results { padding: 20px; }
        .card { 
            background: #0f0f1a; border-radius: 20px; border: 2px solid #00ff88; 
            margin-bottom: 20px; padding: 15px; text-align: left;
        }
        .price { color: #00ff88; font-size: 28px; font-weight: bold; }
        .btn { 
            width: 100%; padding: 15px; background: #00ff88; color: #000; 
            border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">WONDAPP</div>
</div>

<div class="search-area">
    <input type="text" id="q" placeholder="SCRIVI ENI O MARIO..." onkeyup="radar()">
</div>

<div id="view" class="results"></div>

<script>
    // DATABASE BLINDATO
    var BIBBIA = [
        {n: "ENI STATION SGM", c: "Benzinaio", p: "1.759", i: "⛽"},
        {n: "MARIO IL FABBRO", c: "Artigiano", p: "PRONTO", i: "🔧"},
        {n: "PANIFICIO STORICO", c: "Alimentari", p: "1.15", i: "🥖"}
    ];

    function radar() {
        var val = document.getElementById('q').value.toUpperCase();
        var out = document.getElementById('view');
        out.innerHTML = ""; // Pulisce tutto ogni volta che scrivi
        
        if (val.length < 1) return;

        for (var i = 0; i < BIBBIA.length; i++) {
            var shop = BIBBIA[i];
            // Se il nome contiene quello che scrivi...
            if (shop.n.indexOf(val) > -1 || shop.c.toUpperCase().indexOf(val) > -1) {
                out.innerHTML += '<div class="card">' +
                    '<div style="font-size:30px">' + shop.i + '</div>' +
                    '<h2>' + shop.n + '</h2>' +
                    '<p>' + shop.c + '</p>' +
                    '<div class="price">' + shop.p + '</div>' +
                    '<div class="btn">NAVIGA ORA</div>' +
                '</div>';
            }
        }
    }
</script>

</body>
</html>
