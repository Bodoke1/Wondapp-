<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WONDAPP SYSTEM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;800&display=swap');
        :root { --n: #00ff88; --g: #ffd700; --d: #050507; --s: #0f0f1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; border: none; outline: none; }
        body { background: var(--d); color: #fff; font-family: 'Exo 2', sans-serif; }
        
        .header { padding: 20px; border-bottom: 3px solid var(--n); background: var(--s); text-align: center; }
        .logo { font-family: 'Orbitron'; color: var(--n); font-size: 22px; letter-spacing: 2px; }

        .search-box { padding: 20px; background: var(--s); }
        /* BARRA DI RICERCA POTENZIATA */
        #q { width: 100%; padding: 18px; border-radius: 12px; border: 2px solid var(--n); background: #000; color: #fff; font-size: 18px; }

        .results { padding: 20px; }
        .card { background: var(--s); border-radius: 20px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--g); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .price { font-size: 32px; font-weight: 800; color: var(--n); text-align: right; margin: 10px 0; }
        .btn { width: 100%; padding: 18px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-go { background: var(--n); color: #000; }
        .btn-radar { background: transparent; border: 2px solid var(--n); color: var(--n); margin-top: 30px; }
    </style>
</head>
<body>

<div class="header"><div class="logo">WONDAPP</div></div>

<div class="search-box">
    <input type="text" id="q" placeholder="Scrivi qui (es. Pizza o Agip)..." onkeyup="cerca()">
</div>

<div id="view" class="results"></div>

<script>
// LA TUA BIBBIA DATI
const BIBBIA = [
    { nome:"ENI STATION SGM", cat:"Carburante", loc:"Viale Lombardia, San Giuliano M.", prezzo:"1.759", tags:["benzina","agip","eni","gasolio"] },
    { nome:"PIZZERIA DA MIMMO", cat:"Ristorazione", loc:"Via Torino 45, Milano", prezzo:"9.00", tags:["pizza","ristorante","cena"] }
];

function cerca() {
    const query = document.getElementById('q').value.toLowerCase().trim();
    const contenitore = document.getElementById('view');
    
    if (query === "") {
        contenitore.innerHTML = "";
        return;
    }

    // FILTRO AGGRESSIVO: Cerca ovunque
    const filtrati = BIBBIA.filter(item => 
        item.nome.toLowerCase().includes(query) || 
        item.cat.toLowerCase().includes(query) || 
        item.tags.some(t => t.includes(query))
    );

    let output = "";

    if (filtrati.length > 0) {
        // MOSTRA I VIP TROVATI
        output = filtrati.map(item => `
            <div class="card">
                <div style="font-size:12px; color:var(--n); font-weight:800;">${item.cat.toUpperCase()}</div>
                <div style="font-size:22px; font-weight:800; margin:5px 0;">${item.nome}</div>
                <div style="font-size:13px; color:#888;">📍 ${item.loc}</div>
                <div class="price">${item.prezzo}€</div>
                <button class="btn btn-go" onclick="vai('${item.nome}, ${item.loc}')">NAVIGA ORA</button>
            </div>
        `).join('');
    } else {
        // SE NON TROVA NULLA NEI VIP
        output = `<div style="text-align:center; padding:20px; color:#666;">Nessun Merchant VIP trovato...</div>`;
    }

    // AGGIUNGE SEMPRE IL RADAR GLOBALE (Uber Style)
    output += `
        <button class="btn btn-radar" onclick="vai('${query}')">
            ATTIVA RADAR GLOBALE PER: ${query.toUpperCase()}
        </button>
    `;

    contenitore.innerHTML = output;
}

function vai(destinazione) {
    window.open("https://www.google.com/maps/search/" + encodeURIComponent(destinazione), '_blank');
}
</script>

</body>
</html>
