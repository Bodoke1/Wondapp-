<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WONDAPP — DASHBOARD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;800&display=swap');
        :root { --n: #00ff88; --g: #ffd700; --d: #050507; --s: #0f0f1a; }

        * { box-sizing: border-box; margin: 0; padding: 0; border: none; outline: none; }
        body { background: var(--d); color: #fff; font-family: 'Exo 2', sans-serif; overflow-x: hidden; }

        /* HEADER CON LOGO E GLOBO */
        .header { padding: 20px; border-bottom: 2px solid var(--n); background: var(--s); text-align: center; position: relative; }
        .logo { font-family: 'Orbitron'; color: var(--n); font-size: 24px; letter-spacing: 3px; text-shadow: 0 0 10px var(--n); }
        
        /* EFFETTO GLOBO RADAR */
        .radar-circle { width: 60px; height: 60px; border: 2px solid var(--n); border-radius: 50%; margin: 10px auto; position: relative; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0,255,136,0.7); } 70% { box-shadow: 0 0 0 20px rgba(0,255,136,0); } 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0); } }

        /* GRIGLIA ICONE RAPIDE */
        .quick-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 20px; }
        .icon-box { 
            background: var(--s); 
            padding: 15px; 
            border-radius: 15px; 
            text-align: center; 
            /* IL BORDO VERDE WONDAPP */
            border: 2px solid var(--n); 
            box-shadow: 0 0 10px rgba(0,255,136,0.2);
            cursor: pointer;
            transition: 0.3s;
        }
        .icon-box:active { transform: scale(0.9); background: var(--n); }
        .icon-box:active p, .icon-box:active span { color: #000; }
        .icon-box span { display: block; font-size: 28px; margin-bottom: 5px; }
        .icon-box p { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--n); }

        /* AREA RICERCA */
        .search-area { padding: 0 20px 20px 20px; }
        #q { width: 100%; padding: 18px; border-radius: 12px; border: 2px solid var(--n); background: #000; color: #fff; font-size: 16px; text-align: center; }

        /* RISULTATI CON IDENTIFICAZIONE WONDAPP */
        .results { padding: 20px; }
        .merchant-card { 
            background: var(--s); 
            border-radius: 20px; 
            margin-bottom: 20px; 
            border: 2px solid var(--n); /* BORDO WONDAPP */
            overflow: hidden; 
            position: relative;
        }
        .merchant-header { padding: 15px; display: flex; align-items: center; gap: 15px; background: rgba(0,255,136,0.05); }
        .merchant-icon { width: 50px; height: 50px; border: 1px solid var(--n); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #000; }
        
        .merchant-info h3 { font-size: 18px; font-weight: 800; color: #fff; }
        .merchant-info p { font-size: 12px; color: #888; }

        .price-section { padding: 15px; text-align: right; border-top: 1px solid #222; }
        .price-val { font-size: 24px; font-weight: 800; color: var(--n); }

        .btn-action { width: 100%; padding: 15px; background: var(--n); color: #000; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">WONDAPP</div>
    <div class="radar-circle"></div>
</div>

<div class="quick-menu">
    <div class="icon-box" onclick="setQ('Benzinaio')"><span>⛽</span><p>Benzina</p></div>
    <div class="icon-box" onclick="setQ('Artigiano')"><span>🛠️</span><p>Artigiano</p></div>
    <div class="icon-box" onclick="setQ('Pizzeria')"><span>🍕</span><p>Pizza</p></div>
</div>

<div class="search-area">
    <input type="text" id="q" placeholder="RICERCA NEL GLOBO..." onkeyup="run()">
</div>

<div id="view" class="results"></div>

<script>
const DB = [
    { n:"OFFICINA ROSSI", c:"Artigiano", l:"Via Milano 5", p:"LIVE", f:"FREE", i:"🔧" },
    { n:"ENI STATION", c:"Benzinaio", l:"Viale Europa", p:"1.720", f:"GOLD", i:"⛽" }
];

function setQ(v) { document.getElementById('q').value = v; run(); }

function run() {
    const q = document.getElementById('q').value.toLowerCase().trim();
    const v = document.getElementById('view');
    if(!q) { v.innerHTML = ""; return; }

    const filtered = DB.filter(i => i.n.toLowerCase().includes(q) || i.c.toLowerCase().includes(q));
    
    let html = filtered.map(i => `
        <div class="merchant-card">
            <div class="merchant-header">
                <div class="merchant-icon">${i.i}</div>
                <div class="merchant-info">
                    <h3>${i.n}</h3>
                    <p>${i.c} • ${i.l}</p>
                </div>
            </div>
            <div class="price-section">
                <span style="font-size:10px; color:#666; display:block;">TARIFFA WONDAPP</span>
                <span class="price-val">${i.p}€</span>
            </div>
            <button class="btn-action" onclick="alert('Dettagli Interni WondApp di: ${i.n}')">VEDI NEGOZIO</button>
        </div>
    `).join('');

    // Tasto Radar Globale (sempre con stile WondApp)
    html += `
        <div style="text-align:center; padding:20px; border:2px dashed var(--n); border-radius:15px; margin-top:20px;">
            <p style="font-size:12px; color:var(--n); margin-bottom:10px;">NON È TRA I PARTNER? CERCA NEL MONDO</p>
            <button class="btn-action" style="background:transparent; border:2px solid var(--n); color:var(--n);" onclick="alert('Apertura Radar Globale...')">ATTIVA RADAR</button>
        </div>
    `;

    v.innerHTML = html;
}
</script>

</body>
</html>
